# Hermes model configuration.
#
# Main loop: DeepSeek-V4-Pro — stronger agentic reasoning, knowledge and
# difficult-reasoning work, which is what actually drives the assistant.
# Delegation and every auxiliary task (titles, compression, web extract,
# vision, triage...) stay on V4-Flash: high-volume, latency-sensitive work
# where the budget tier is the right call, and it keeps one rate limit and one
# billing bucket for everything except the main loop.
model:
  provider: deepseek
  default: deepseek-v4-pro
delegation:
  provider: deepseek
  model: deepseek-v4-flash
auxiliary:
  vision:
    provider: deepseek
    model: deepseek-v4-flash
  web_extract:
    provider: deepseek
    model: deepseek-v4-flash
  title_generation:
    provider: deepseek
    model: deepseek-v4-flash
  tts_audio_tags:
    provider: deepseek
    model: deepseek-v4-flash
  compression:
    provider: deepseek
    model: deepseek-v4-flash
  approval:
    provider: deepseek
    model: deepseek-v4-flash
  triage_specifier:
    provider: deepseek
    model: deepseek-v4-flash
  kanban_decomposer:
    provider: deepseek
    model: deepseek-v4-flash
  profile_describer:
    provider: deepseek
    model: deepseek-v4-flash
