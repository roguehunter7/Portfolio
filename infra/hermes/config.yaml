# Hermes model configuration.
#
# Every call — the main loop, delegation and each auxiliary task — runs on
# DeepSeek-V4-Flash. One model keeps a single rate limit and billing bucket,
# and it is the cheapest tier that covers all of the box's work.
model:
  provider: deepseek
  default: deepseek-flash
delegation:
  provider: deepseek
  model: deepseek-flash
auxiliary:
  vision:
    provider: deepseek
    model: deepseek-flash
  web_extract:
    provider: deepseek
    model: deepseek-flash
  title_generation:
    provider: deepseek
    model: deepseek-flash
  tts_audio_tags:
    provider: deepseek
    model: deepseek-flash
  compression:
    provider: deepseek
    model: deepseek-flash
  approval:
    provider: deepseek
    model: deepseek-flash
  triage_specifier:
    provider: deepseek
    model: deepseek-flash
  kanban_decomposer:
    provider: deepseek
    model: deepseek-flash
  profile_describer:
    provider: deepseek
    model: deepseek-flash
