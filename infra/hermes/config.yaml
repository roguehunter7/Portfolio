# Hermes model configuration.
#
# Main loop: DeepSeek-V4-Pro — picked deliberately over V4-Flash. DeepSeek
# releases V4.1 Flash around 2026-09-10 and, until V4.1 Pro ships, routes V4 Pro
# requests to V4.1 Flash and bills them at V4.1 Flash rates. This id therefore
# gets the stronger model now and upgrades itself when V4.1 Pro lands, with no
# config change here. Do not "correct" it back to flash on cost grounds.
# Delegation and every auxiliary task (titles, compression, web extract,
# vision, triage...) stay on V4-Flash: high-volume, latency-sensitive work
# where the budget tier is the right call, and it keeps one rate limit and one
# billing bucket for everything except the main loop.
model:
  provider: deepseek
  default: deepseek-v4-pro
delegation:
  provider: deepseek
  model: deepseek-v4-flash
auxiliary:
  vision:
    provider: deepseek
    model: deepseek-v4-flash
  web_extract:
    provider: deepseek
    model: deepseek-v4-flash
  title_generation:
    provider: deepseek
    model: deepseek-v4-flash
  tts_audio_tags:
    provider: deepseek
    model: deepseek-v4-flash
  compression:
    provider: deepseek
    model: deepseek-v4-flash
  approval:
    provider: deepseek
    model: deepseek-v4-flash
  triage_specifier:
    provider: deepseek
    model: deepseek-v4-flash
  kanban_decomposer:
    provider: deepseek
    model: deepseek-v4-flash
  profile_describer:
    provider: deepseek
    model: deepseek-v4-flash
