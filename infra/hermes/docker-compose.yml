# Hermes Agent — AI assistant with no open ports (Telegram polling + DeepSeek API).
#
# Runs on the Oracle A1.Flex dev box next to DeepSeek Harness. The official
# image carries its own Python/Node/Chromium, so Hermes adds nothing to the
# host toolchain and the agent cannot read the host's credentials
# (/home/ubuntu/.dsh, ~/.config/gh, the repo) — it only sees /opt/data.
#
# No port is published to the network: Telegram is long-polled outbound. The
# gateway's OpenAI-compatible API + dashboard on 8642 is bound to loopback
# only, so it is reachable from the box but never from the internet.
#
# The image tracks :latest, and the box's monthly maintenance job pulls it
# (`docker compose pull && up -d`), so Hermes follows upstream releases without
# a manual bump. `hermes update` is not supported inside Docker by design —
# updating means a new image.
services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    # /opt/hermes/.env is root-owned 0600, written by cloud-init from GitHub
    # secrets via Terraform. The same path is /opt/data/.env in the container,
    # which Hermes reads itself; env_file keeps the process environment in sync.
    env_file:
      - /opt/hermes/.env
    volumes:
      - /opt/hermes:/opt/data
    ports:
      - "127.0.0.1:8642:8642"
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
