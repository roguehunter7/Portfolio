<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>og</title>
<style>
  @font-face {
    font-family: "Space Grotesk";
    src: url("../fonts/space-grotesk-latin-700-normal.woff2") format("woff2");
    font-weight: 700; font-display: swap;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("../fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2");
    font-weight: 400; font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0b0f19;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    color: #e2e8f0;
    position: relative;
  }
  .glow-a, .glow-b { position: absolute; border-radius: 50%; filter: blur(0); }
  .glow-a { width: 520px; height: 520px; top: -200px; right: -140px;
    background: radial-gradient(circle, rgba(96,165,250,0.28), transparent 70%); }
  .glow-b { width: 460px; height: 460px; bottom: -220px; left: -160px;
    background: radial-gradient(circle, rgba(167,139,250,0.22), transparent 70%); }
  .wrap { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; }
  .chip {
    font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 26px;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  h1 {
    font-family: "Space Grotesk", sans-serif; font-weight: 700;
    font-size: 88px; line-height: 1.05; letter-spacing: -0.03em; margin-top: 26px;
  }
  h1 .grad {
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub { font-size: 34px; color: #60a5fa; margin-top: 14px; letter-spacing: -0.01em; }
  .tags { margin-top: 40px; display: flex; gap: 12px; }
  .tag {
    font-family: "JetBrains Mono", monospace; font-size: 21px; color: #93c5fd;
    border: 1px solid rgba(96,165,250,0.35); background: rgba(96,165,250,0.08);
    padding: 8px 18px; border-radius: 4px;
  }
  .foot {
    margin-top: auto; display: flex; gap: 28px;
    font-family: "JetBrains Mono", monospace; font-size: 22px; color: #94a3b8;
  }
  .foot .dot { color: #4ade80; }
</style>
</head>
<body>
  <div class="glow-a"></div><div class="glow-b"></div>
  <div class="wrap">
    <div class="chip">sk_</div>
    <h1>Sreeram <span class="grad">K R</span></h1>
    <div class="sub">Cloud &amp; Infrastructure Automation Engineer</div>
    <div class="tags">
      <span class="tag">TERRAFORM</span><span class="tag">GCP</span>
      <span class="tag">CLOUDFLARE</span><span class="tag">ZERO TRUST</span>
    </div>
    <div class="foot">
      <span><span class="dot">&#9679;</span> uptime 100%</span>
      <span>$0/month</span>
      <span>0 exposed ports</span>
      <span>sreeramkr.com</span>
    </div>
  </div>
</body>
</html>
