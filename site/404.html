<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Not Found</title>
<style>
  :root {
    --bg: #0b0f19; --text: #e2e8f0; --text-dim: #94a3b8;
    --blue: #60a5fa; --border: #1e293b;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.7;
    margin: 0; display: flex; align-items: center; justify-content: center;
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  .box { text-align: center; padding: 40px; }
  h1 { font-size: 4em; color: var(--blue); margin: 0; font-weight: 700; letter-spacing: -0.03em; }
  p { color: var(--text-dim); margin: 8px 0 24px; }
  a { color: var(--blue); text-decoration: none; border: 1px solid var(--border); border-radius: 8px; padding: 8px 20px; transition: 0.2s; }
  a:hover { background: var(--blue); color: var(--bg); }
</style>
</head>
<body>
<div class="box">
  <h1>404</h1>
  <p>This page doesn't exist.</p>
  <a href="/">Back to Home</a>
</div>
</body>
</html>
