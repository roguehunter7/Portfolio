server {
    listen       8080;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # Enable Nginx status module
    location /status {
        stub_status;
        allow all;
    }

    # Proxy /api/stats to metrics daemon on host
    location /api/stats {
        proxy_pass http://host.docker.internal:5000/api/stats;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy /api/chaos to metrics daemon on host
    location /api/chaos {
        proxy_pass http://host.docker.internal:5000/api/chaos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
