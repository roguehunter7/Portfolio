name: Deploy Hardened Portfolio via GCP IAP

on:
  push:
    branches:
      - main

env:
  # Opt into Node.js 24 to suppress the deprecation warning
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Authenticate with GCP via Service Account Key
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 2. Setup Google Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. Compile LaTeX document
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex

      # 4. Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Build and Push Nginx Image (with pinned SHA tag)
      - name: Build and Push Nginx Image
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/${REPO_LOWER}/portfolio-web:${{ github.sha }} .
          docker push ghcr.io/${REPO_LOWER}/portfolio-web:${{ github.sha }}

      # 6. Securely Tunnel through IAP (Port 22) and deploy
      - name: SSH via IAP and Execute deploy.sh
        run: |
          gcloud compute ssh portfolio-zero-trust-node \
            --zone="us-central1-a" \
            --quiet \
            --tunnel-through-iap \
            --command="sudo IMAGE_TAG=${{ github.sha }} /opt/portfolio/deploy.sh"