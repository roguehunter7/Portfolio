name: Deploy Hardened Portfolio via GCP IAP

on:
  push:
    branches:
      - main

env:
  # Opt into Node.js 24 to suppress the deprecation warning
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Authenticate with GCP via Service Account Key
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 2. Setup Google Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. Compile LaTeX document
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex

      # 4. Copy resume.pdf to VM via IAP
      - name: Copy resume.pdf to VM via IAP
        run: |
          gcloud compute scp resume.pdf portfolio-zero-trust-node:/tmp/resume.pdf \
            --zone="us-central1-a" \
            --quiet \
            --tunnel-through-iap

      # 5. Securely Tunnel through IAP (Port 22) and deploy (WITH --QUIET FLAG)
      - name: SSH via IAP and Execute deploy.sh
        run: |
          gcloud compute ssh portfolio-zero-trust-node \
            --zone="us-central1-a" \
            --quiet \
            --tunnel-through-iap \
            --command="sudo /opt/portfolio/deploy.sh"