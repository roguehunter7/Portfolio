name: Deploy Portfolio

on:
  push:
    branches:
      - main

permissions:
  contents: 'read'
  id-token: 'write'
  packages: 'write'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Resume PDF
        id: cache-resume
        uses: actions/cache@v4
        with:
          path: resume.pdf
          key: resume-pdf-${{ hashFiles('resume.tex') }}

      - name: Compile LaTeX document
        if: steps.cache-resume.outputs.cache-hit != 'true'
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex

      - name: Authenticate to Google Cloud (OIDC/WIF)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG="ghcr.io/roguehunter7/portfolio-web:latest"
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="cloudflare_tunnel_token=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}"

      - name: SSH via IAP and Execute deploy.sh on VM
        run: |
          echo "Connecting to VM and waiting for startup script to finish..."
          gcloud compute ssh portfolio-zero-trust-node \
            --zone="us-central1-a" \
            --quiet \
            --tunnel-through-iap \
            --command="timeout 350 bash -c 'until [ -f /var/log/startup_script_complete ]; do echo \"Waiting for VM initialization...\"; sleep 10; done' && sudo CLOUDFLARE_TUNNEL_TOKEN='${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}' /opt/portfolio/deploy.sh"