name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: 'read'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Render HTML resume to PDF
        run: bash scripts/render-pdf.sh site/resume.html site/resume.pdf

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx --yes wrangler@4.120.0 pages project list | grep -qw portfolio; then
            npx --yes wrangler@4.120.0 pages project create portfolio --production-branch=main
          fi
          npx --yes wrangler@4.120.0 pages deploy site --project-name=portfolio
