name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: 'read'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Resume PDF
        id: cache-resume
        uses: actions/cache@v4
        with:
          path: site/resume.pdf
          key: resume-pdf-${{ hashFiles('site/resume.html', 'site/fonts/*') }}

      - name: Render HTML resume to PDF
        if: steps.cache-resume.outputs.cache-hit != 'true'
        run: bash scripts/render-pdf.sh site/resume.html site/resume.pdf

      - name: Create Cloudflare Pages project (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create portfolio --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy site --project-name=portfolio
