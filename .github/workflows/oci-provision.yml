name: OCI Provision

on:
  workflow_dispatch:
    inputs:
      reset:
        description: 'Reset: destroy the instance and rebuild it from scratch'
        type: boolean
        default: false
      keep_snapshots:
        description: 'Keep the snapshots during a reset (requires reset; the rebuilt box then restores the newest one)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: oci-provision
  # Never cancel mid-run: interrupting a destroy/apply can leave a stale tfstate
  # lock and a half-deleted tenancy. Queue instead.
  cancel-in-progress: false

env:
  BACKUP_BUCKET: hermes-backups

jobs:
  # Cheap static guards. Both of these caught real bugs during development (a
  # nested-quote syntax error in provision.sh, and a literal ${...} in a
  # template comment that Terraform tried to evaluate).
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/oci

      - name: Render and validate cloud-init
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check-cloud-init.py

  provision:
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Secrets are scoped to this job only — the checks job has no business
    # carrying them. Passed as TF_VAR_* rather than -var flags: they stay out of
    # the process list and the command line, and GitHub masks them in the log.
    env:
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_ssh_public_key: ${{ vars.OCI_SSH_PUBLIC_KEY }}
      TF_VAR_cloudflare_tunnel_token: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      TF_VAR_deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
      TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TF_VAR_telegram_allowed_users: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
      TF_VAR_hermes_dashboard_password: ${{ secrets.HERMES_DASHBOARD_PASSWORD }}
      TF_VAR_hermes_dashboard_secret: ${{ secrets.HERMES_DASHBOARD_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check inputs
        if: ${{ inputs.keep_snapshots && !inputs.reset }}
        run: |
          echo "keep_snapshots only means something together with reset — with no reset there is nothing to protect." >&2
          echo "Untick keep_snapshots, or tick reset as well." >&2
          exit 1

      - name: Install OCI CLI (pinned, venv)
        run: |
          python3 -m venv /tmp/oci-cli-venv
          /tmp/oci-cli-venv/bin/pip install --quiet oci-cli==3.90.2
          echo "/tmp/oci-cli-venv/bin" >> "$GITHUB_PATH"

      - name: Configure OCI CLI from secrets
        env:
          OCI_CLI_KEY: ${{ secrets.OCI_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_CLI_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user = ${{ secrets.OCI_USER_OCID }}
          fingerprint = ${{ secrets.OCI_FINGERPRINT }}
          tenancy = ${{ secrets.OCI_TENANCY_OCID }}
          region = ap-hyderabad-1
          key_file = ~/.oci/oci_api_key.pem
          EOF
          # Smoke-test auth (fail fast on a bad key)
          oci iam region list >/dev/null

      - name: Ensure tfstate bucket exists (idempotent)
        env:
          TFSTATE_BUCKET: ${{ vars.OCI_TFSTATE_BUCKET }}
        run: |
          set -euo pipefail
          NAMESPACE="$(oci os ns get --query 'data' --raw-output)"
          echo "OCI_NAMESPACE=$NAMESPACE" >> "$GITHUB_ENV"
          oci os bucket create \
            --namespace "$NAMESPACE" \
            --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
            --name "$TFSTATE_BUCKET" \
            >/dev/null 2>&1 || echo "bucket $TFSTATE_BUCKET already exists"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init (OCI Object Storage backend)
        working-directory: infra/oci
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.OCI_TFSTATE_BUCKET }}" \
            -backend-config="namespace=${{ env.OCI_NAMESPACE }}" \
            -backend-config="key=oci/terraform.tfstate"

      - name: Terraform Apply (backup prerequisites)
        # The host restores itself from this bucket on first boot, so the
        # bucket, the dynamic group and the policy must exist before the
        # instance does. Targeted, so a running box is untouched, and
        # idempotent on every later run.
        working-directory: infra/oci
        run: |
          terraform apply -auto-approve \
            -target=oci_objectstorage_bucket.hermes_backups \
            -target=oci_identity_dynamic_group.hermes_backup \
            -target=oci_identity_policy.hermes_backup

      - name: Wipe snapshots (reset path)
        # bulk-delete with no prefix removes every object in the bucket, so the
        # rebuilt box starts with no state at all.
        if: ${{ inputs.reset && !inputs.keep_snapshots }}
        run: |
          oci os object bulk-delete \
            --namespace "$OCI_NAMESPACE" \
            --bucket-name "$BACKUP_BUCKET" \
            --force
          echo "$BACKUP_BUCKET is empty — the rebuilt box starts with no state"

      - name: Terraform Destroy (reset path)
        # Target only the instance: a full destroy would try to take the
        # snapshot bucket with it, which prevent_destroy refuses.
        if: ${{ inputs.reset }}
        working-directory: infra/oci
        run: |
          if terraform state list | grep -q '^oci_core_instance.portfolio_node$'; then
            terraform destroy -auto-approve -target=oci_core_instance.portfolio_node
          else
            echo "no instance in state — nothing to destroy"
          fi

      - name: Terraform Apply
        working-directory: infra/oci
        run: terraform apply -auto-approve

      - name: Show outputs
        working-directory: infra/oci
        run: terraform output
