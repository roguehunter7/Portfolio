name: OCI Provision

on:
  workflow_dispatch:
    inputs:
      destroy_first:
        description: 'Destroy VM, then re-apply (rebuild)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: oci-provision
  cancel-in-progress: true

env:
  # Auth is configured once, in the "Configure OCI CLI from secrets" step below,
  # which writes ~/.oci/config + the API key file. Both the oci CLI and the
  # Terraform provider read that profile, so no duplicate OCI_* env vars here.
  # (Terraform variables: tenancy OCID doubles as the root compartment OCID.)
  #
  # Secrets are passed as TF_VAR_* rather than -var flags: they stay out of the
  # process list and the command line, and GitHub masks them in the log.
  TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
  TF_VAR_ssh_public_key: ${{ vars.OCI_SSH_PUBLIC_KEY }}
  TF_VAR_cloudflare_tunnel_token: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
  TF_VAR_ttyd_password: ${{ secrets.TTYD_PASSWORD }}
  TF_VAR_deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
  TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TF_VAR_telegram_allowed_users: ${{ secrets.TELEGRAM_ALLOWED_USERS }}

jobs:
  # Cheap static guards. Both of these caught real bugs during development (a
  # nested-quote syntax error in provision.sh, and a literal ${...} in a
  # template comment that Terraform tried to evaluate).
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/oci

      - name: Render and validate cloud-init
        run: python3 scripts/check-cloud-init.py

  # Prove every package name resolves on the exact image the VM boots: the
  # packages are installed for real in an oraclelinux:10 container (throwaway),
  # which also confirms the EPEL and Cloudflare repos serve aarch64/x86_64.
  deps:
    runs-on: ubuntu-latest
    container: oraclelinux:10
    timeout-minutes: 20
    steps:
      - name: Install the exact package set
        run: |
          set -euo pipefail
          dnf install -y curl dnf-plugins-core
          curl -fsSL https://pkg.cloudflare.com/cloudflared.repo > /etc/yum.repos.d/cloudflared.repo
          dnf install -y oracle-epel-release-el10
          dnf install -y \
            ca-certificates curl git gnupg2 jq tmux cronie firewalld \
            python3 make gcc-c++ unzip xz nodejs dnf-plugins-core policycoreutils-python-utils \
            ttyd ripgrep htop gh cloudflared \
            nss atk at-spi2-core cups-libs libdrm libxkbcommon mesa-libgbm pango cairo alsa-lib
          echo '--- resolved versions ---'
          node --version
          npm --version
          gh --version | head -1
          ttyd --version
          cloudflared --version
          jq --version

  provision:
    needs: [checks, deps]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OCI CLI (pinned, venv)
        run: |
          python3 -m venv /tmp/oci-cli-venv
          /tmp/oci-cli-venv/bin/pip install --quiet oci-cli==3.90.2
          echo "/tmp/oci-cli-venv/bin" >> "$GITHUB_PATH"

      - name: Configure OCI CLI from secrets
        env:
          OCI_CLI_KEY: ${{ secrets.OCI_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_CLI_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user = ${{ secrets.OCI_USER_OCID }}
          fingerprint = ${{ secrets.OCI_FINGERPRINT }}
          tenancy = ${{ secrets.OCI_TENANCY_OCID }}
          region = ap-hyderabad-1
          key_file = ~/.oci/oci_api_key.pem
          EOF
          # Smoke-test auth (fail fast on a bad key)
          oci iam region list >/dev/null

      - name: Ensure tfstate bucket exists (idempotent)
        env:
          TFSTATE_BUCKET: ${{ vars.OCI_TFSTATE_BUCKET }}
        run: |
          set -euo pipefail
          NAMESPACE="$(oci os ns get --query 'data' --raw-output)"
          echo "OCI_NAMESPACE=$NAMESPACE" >> "$GITHUB_ENV"
          oci os bucket create \
            --namespace "$NAMESPACE" \
            --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
            --name "$TFSTATE_BUCKET" \
            >/dev/null 2>&1 || echo "bucket $TFSTATE_BUCKET already exists"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init (OCI Object Storage backend)
        working-directory: infra/oci
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.OCI_TFSTATE_BUCKET }}" \
            -backend-config="namespace=${{ env.OCI_NAMESPACE }}" \
            -backend-config="key=oci/terraform.tfstate"

      - name: Terraform Destroy (rebuild path)
        if: ${{ github.event.inputs.destroy_first == 'true' }}
        working-directory: infra/oci
        run: terraform destroy -auto-approve

      - name: Terraform Apply
        working-directory: infra/oci
        run: terraform apply -auto-approve

      - name: Show outputs
        working-directory: infra/oci
        run: terraform output
