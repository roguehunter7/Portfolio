name: Vaultwarden Setup

on:
  workflow_dispatch:
    inputs:
      rebuild_vm:
        description: 'Fully destroy and rebuild the VM from scratch (nuke + recreate)'
        type: boolean
        default: false

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC/WIF)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false

      - name: Pre-deploy backup
        # Refresh the snapshot from the live VM before apply, so a forced VM
        # replacement (e.g. a startup-script change) cannot lose the latest data.
        # Best-effort: a dead VM must not block recovery from the last nightly.
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            gcloud compute scp infra/vaultwarden/backup.sh portfolio-zero-trust-node:/tmp/backup.sh \
              --zone="us-central1-a" --quiet --tunnel-through-iap --ssh-key-expire-after=1h && break
            echo "backup scp attempt $i failed"; sleep 15
          done
          for i in 1 2 3; do
            gcloud compute ssh portfolio-zero-trust-node --zone="us-central1-a" --quiet --tunnel-through-iap \
              --ssh-key-expire-after=1h \
              --command="sudo install -m 0644 -o root -g root /tmp/backup.sh /opt/vaultwarden/backup.sh && \
                rm -f /tmp/backup.sh && sudo bash /opt/vaultwarden/backup.sh" && break
            echo "backup ssh attempt $i failed"; sleep 15
          done

      - name: Destroy VM (rebuild path)
        if: ${{ inputs.rebuild_vm }}
        working-directory: infra
        # Target only the VM. A full destroy would delete the backup bucket (or
        # fail on it while it is non-empty), which is exactly what we restore from.
        run: terraform destroy -auto-approve -target=google_compute_instance.vm_instance

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve

      - name: Wait for VM boot + startup script
        run: |
          for i in $(seq 1 60); do
            gcloud compute ssh portfolio-zero-trust-node --zone="us-central1-a" --quiet --tunnel-through-iap --ssh-key-expire-after=1h --command="true" >/dev/null 2>&1 && break
            [ "$i" = 60 ] && { echo "VM SSH never came up" >&2; exit 1; }
            sleep 15
          done
          ok=0
          for i in 1 2 3; do
            gcloud compute ssh portfolio-zero-trust-node --zone="us-central1-a" --quiet --tunnel-through-iap \
              --ssh-key-expire-after=1h \
              --command="timeout 900 bash -c 'until [ -f /var/log/startup_script_complete ]; do sleep 10; done' || \
              { echo 'startup script did not complete (see /var/log/startup.log)'; exit 1; }; \
              docker --version; docker compose version; gcloud --version | head -1" && { ok=1; break; }
            echo "startup wait attempt $i failed"; sleep 15
          done
          [ "$ok" = 1 ] || { echo "startup script check failed" >&2; exit 1; }

      - name: Push compose + secrets, start stack
        env:
          CLOUDFLARE_TUNNEL_TOKEN_VW: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN_VW }}
          VAULTWARDEN_ADMIN_TOKEN: ${{ secrets.VAULTWARDEN_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          # Build .env locally. docker-compose interpolates `$`, so the Argon2 `$`
          # must be doubled to `$$` (compose collapses `$$` -> `$` in the container env).
          ADMIN_TOKEN_DOLLARED=$(printf '%s' "$VAULTWARDEN_ADMIN_TOKEN" | sed 's/\$/\$\$/g')
          cat > /tmp/vw.env <<EOF
          TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN_VW}
          ADMIN_TOKEN=${ADMIN_TOKEN_DOLLARED}
          EOF
          chmod 600 /tmp/vw.env

          scp_ok=0
          for i in 1 2 3 4 5; do
            gcloud compute scp \
              infra/vaultwarden/docker-compose.yml infra/vaultwarden/backup.sh infra/vaultwarden/restore.sh /tmp/vw.env \
              portfolio-zero-trust-node:/tmp/ \
              --zone="us-central1-a" --quiet --tunnel-through-iap --ssh-key-expire-after=1h && { scp_ok=1; break; }
            echo "scp attempt $i failed"; sleep 15
          done
          [ "$scp_ok" = 1 ] || { echo "could not copy files to the VM" >&2; exit 1; }

          ssh_ok=0
          for i in 1 2 3 4 5; do
            gcloud compute ssh portfolio-zero-trust-node --zone="us-central1-a" --quiet --tunnel-through-iap \
              --ssh-key-expire-after=1h \
              --command="sudo install -d -m 0755 -o root -g root /opt/vaultwarden && \
                sudo install -m 0644 -o root -g root /tmp/docker-compose.yml /opt/vaultwarden/docker-compose.yml && \
                sudo install -m 0644 -o root -g root /tmp/backup.sh /opt/vaultwarden/backup.sh && \
                sudo install -m 0755 -o root -g root /tmp/restore.sh /opt/vaultwarden/restore.sh && \
                sudo install -m 0600 -o root -g root /tmp/vw.env /opt/vaultwarden/.env && \
                rm -f /tmp/vw.env /tmp/docker-compose.yml /tmp/backup.sh /tmp/restore.sh && \
                sudo /opt/vaultwarden/restore.sh '${{ inputs.rebuild_vm }}' && \
                cd /opt/vaultwarden && sudo docker compose up -d --force-recreate" && { ssh_ok=1; break; }
            echo "ssh attempt $i failed"; sleep 15
          done
          [ "$ssh_ok" = 1 ] || { echo "deploy over SSH failed" >&2; exit 1; }

      - name: Verify stack
        run: |
          ok=0
          for i in 1 2 3; do
            gcloud compute ssh portfolio-zero-trust-node --zone="us-central1-a" --quiet --tunnel-through-iap \
              --ssh-key-expire-after=1h \
              --command="cd /opt/vaultwarden && \
                echo '--- compose ---' && sudo docker compose ps && \
                echo '--- alive ---' && curl -fsS http://localhost:8000/alive && echo && \
                echo '--- env keys (values hidden) ---' && sudo grep -cE '^(TUNNEL_TOKEN|ADMIN_TOKEN)=' /opt/vaultwarden/.env && \
                echo '--- backup ---' && sudo test -f /opt/vaultwarden/backup.sh && echo 'backup.sh present' && \
                sudo test -f /opt/vaultwarden/restore.sh && echo 'restore.sh present' && \
                echo '--- tunnel ---' && (sudo docker logs cloudflared --tail 30 2>&1 | grep -iE 'registered|error' | tail -5 || true)" && { ok=1; break; }
            echo "verify attempt $i failed"; sleep 15
          done
          [ "$ok" = 1 ] || { echo "verify failed" >&2; exit 1; }
