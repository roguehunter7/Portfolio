name: Hermes Setup

on:
  workflow_dispatch:
    inputs:
      destroy_vm:
        description: 'Destroy the VM (terraform destroy) and stop'
        type: boolean
        default: false
      rebuild_vm:
        description: 'Recreate the VM from scratch (instance replacement)'
        type: boolean
        default: false

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC/WIF)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false

      - name: Destroy VM
        if: ${{ inputs.destroy_vm == 'true' }}
        working-directory: infra
        run: terraform destroy -auto-approve

      - name: Terraform Apply
        if: ${{ inputs.destroy_vm != 'true' || inputs.rebuild_vm == 'true' }}
        working-directory: infra
        run: |
          ARGS=""
          if [ "${{ inputs.rebuild_vm }}" = "true" ]; then
            ARGS="-replace=google_compute_instance.vm_instance"
          fi
          terraform apply -auto-approve $ARGS

      - name: Wait for SSH, verify VM
        if: ${{ inputs.destroy_vm != 'true' || inputs.rebuild_vm == 'true' }}
        run: |
          for i in $(seq 1 30); do
            gcloud compute ssh portfolio-zero-trust-node --zone="us-central1-a" --quiet --tunnel-through-iap --command="true" >/dev/null 2>&1 && break
            [ "$i" = 30 ] && { echo "VM SSH never came up" >&2; exit 1; }
            sleep 15
          done
          gcloud compute ssh portfolio-zero-trust-node --zone="us-central1-a" --quiet --tunnel-through-iap \
            --command="timeout 400 bash -c 'until [ -f /var/log/startup_script_complete ]; do sleep 10; done' || \
            { echo 'startup script did not complete (see /var/log/startup.log)'; exit 1; }; \
            free -m | head -2; zramctl | tail -1; sysctl vm.swappiness; \
            command -v docker >/dev/null && echo 'docker present (unexpected)' || echo 'no docker (expected)'"

      - name: Install and configure Hermes
        if: ${{ inputs.destroy_vm != 'true' || inputs.rebuild_vm == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
        run: |
          cat scripts/hermes-install.sh \
            | gcloud compute ssh portfolio-zero-trust-node \
                --zone="us-central1-a" --quiet --tunnel-through-iap \
                --command="sudo GEMINI_API_KEY='$GEMINI_API_KEY' TELEGRAM_BOT_TOKEN='$TELEGRAM_BOT_TOKEN' TELEGRAM_ALLOWED_USERS='$TELEGRAM_ALLOWED_USERS' bash -s"

      - name: Verify Hermes gateway
        if: ${{ inputs.destroy_vm != 'true' || inputs.rebuild_vm == 'true' }}
        run: |
          gcloud compute ssh portfolio-zero-trust-node --zone="us-central1-a" --quiet --tunnel-through-iap \
            --command="sudo -u hermes XDG_RUNTIME_DIR=/run/user/\$(id -u hermes) systemctl --user is-active hermes-gateway && \
            sudo -u hermes XDG_RUNTIME_DIR=/run/user/\$(id -u hermes) journalctl --user -u hermes-gateway -n 20 --no-pager"
