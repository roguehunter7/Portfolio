name: Hermes Setup

on:
  workflow_dispatch:
    inputs:
      rebuild_vm:
        description: 'Fully destroy and rebuild the VM from scratch (nuke + recreate)'
        type: boolean
        default: false
  push:
    paths:
      - 'infra/**'
      - 'scripts/hermes-install.sh'
      - '.github/workflows/hermes-setup.yml'

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC/WIF)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false

      - name: Destroy VM (rebuild path)
        if: ${{ inputs.rebuild_vm == 'true' }}
        working-directory: infra
        run: terraform destroy -auto-approve

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve

      - name: Install and configure Hermes (waits for SSH)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
        run: |
          for i in $(seq 1 30); do
            gcloud compute ssh portfolio-zero-trust-node --zone="us-central1-a" --quiet --tunnel-through-iap --command="true" >/dev/null 2>&1 && break
            [ "$i" = 30 ] && { echo "VM SSH never came up" >&2; exit 1; }
            sleep 15
          done
          gcloud compute ssh portfolio-zero-trust-node --zone="us-central1-a" --quiet --tunnel-through-iap \
            --command="timeout 400 bash -c 'until [ -f /var/log/startup_script_complete ]; do sleep 10; done' || \
            { echo 'startup script did not complete (see /var/log/startup.log)'; exit 1; }; \
            free -m | head -2; zramctl | tail -1; sysctl vm.swappiness; \
            command -v docker >/dev/null && echo 'docker present (unexpected)' || echo 'no docker (expected)'"
          cat scripts/hermes-install.sh \
            | gcloud compute ssh portfolio-zero-trust-node \
                --zone="us-central1-a" --quiet --tunnel-through-iap \
                --command="sudo DEEPSEEK_API_KEY='$DEEPSEEK_API_KEY' TELEGRAM_BOT_TOKEN='$TELEGRAM_BOT_TOKEN' TELEGRAM_ALLOWED_USERS='$TELEGRAM_ALLOWED_USERS' bash -s"

      - name: Verify Hermes gateway
        run: |
          gcloud compute ssh portfolio-zero-trust-node --zone="us-central1-a" --quiet --tunnel-through-iap \
            --command="sudo -u hermes XDG_RUNTIME_DIR=/run/user/\$(id -u hermes) systemctl --user is-active hermes-gateway; \
            echo '--- .env keys (values hidden) ---'; \
            sudo grep -cE '^(DEEPSEEK_API_KEY|TELEGRAM_BOT_TOKEN|TELEGRAM_ALLOWED_USERS)=' /home/hermes/.hermes/.env; \
            sudo awk -F= '/^TELEGRAM_ALLOWED_USERS=/{print \"TELEGRAM_ALLOWED_USERS value length: \" length(\$2)}' /home/hermes/.hermes/.env; \
            echo '--- telegram log ---'; \
            sudo -u hermes XDG_RUNTIME_DIR=/run/user/\$(id -u hermes) journalctl --user -u hermes-gateway -n 60 --no-pager | grep -iE 'telegram|allow|error|fail' | tail -20"
