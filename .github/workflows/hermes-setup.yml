name: Hermes Setup

on:
  workflow_dispatch:

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC/WIF)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform Apply (25 GB disk + minimal startup script)
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -var="cloudflare_tunnel_token=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}"

      - name: Wait for SSH and verify VM state
        run: |
          echo "Waiting for VM SSH (IAP)..."
          SSH_UP=0
          for i in $(seq 1 30); do
            if gcloud compute ssh portfolio-zero-trust-node \
                --zone="us-central1-a" --quiet --tunnel-through-iap \
                --command="true" >/dev/null 2>&1; then
              echo "SSH up after ${i} attempt(s)"
              SSH_UP=1
              break
            fi
            sleep 15
          done
          [ "$SSH_UP" = "1" ] || { echo "ERROR: VM SSH never became reachable" >&2; exit 1; }

          gcloud compute ssh portfolio-zero-trust-node \
            --zone="us-central1-a" --quiet --tunnel-through-iap \
            --command="timeout 400 bash -c 'until [ -f /var/log/startup_script_complete ]; do echo \"Waiting for VM initialization...\"; sleep 10; done'
            echo '--- memory ---'
            free -m
            echo '--- swappiness ---'
            sysctl vm.swappiness vm.page-cluster
            echo '--- zram ---'
            zramctl
            echo '--- cloudflared ---'
            systemctl is-active cloudflared
            echo '--- docker (should be absent) ---'
            command -v docker || echo 'no docker (expected)'"

      - name: Install and configure Hermes (Gemini + Telegram)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ vars.TELEGRAM_ALLOWED_USERS }}
        run: |
          cat scripts/hermes-install.sh \
            | gcloud compute ssh portfolio-zero-trust-node \
                --zone="us-central1-a" --quiet --tunnel-through-iap \
                --command="sudo GEMINI_API_KEY='$GEMINI_API_KEY' TELEGRAM_BOT_TOKEN='$TELEGRAM_BOT_TOKEN' bash -s"

      - name: Verify Hermes service (with diagnostics)
        run: |
          gcloud compute ssh portfolio-zero-trust-node \
            --zone="us-central1-a" --quiet --tunnel-through-iap \
            --command="systemctl is-active hermes; echo '--- listening ports ---'; ss -tlnp | grep -E '8644|LISTEN' | head -10; echo '--- hermes journal ---'; journalctl -u hermes -n 40 --no-pager; echo '--- local gateway probe ---'; curl -s -o /dev/null -w 'local :8644 -> %{http_code}\n' http://127.0.0.1:8644/ || echo 'curl failed'"
