version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-web
    ports:
      - "80:8080"
    depends_on:
      - metrics-daemon
    restart: always

  metrics-daemon:
    build:
      context: .
      dockerfile: Dockerfile.daemon
    container_name: metrics-daemon
    volumes:
      - /opt/portfolio:/opt/portfolio
      - /proc:/host/proc:ro
    restart: always
