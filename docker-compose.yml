version: '3.8'

services:
  web:
    image: ghcr.io/roguehunter7/portfolio-web:${IMAGE_TAG}
    restart: always
    # No ports exposed to the host VM to maintain a Zero-Ingress architecture.
    # The Cloudflare tunnel handles routing traffic directly inside this Docker network.

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
